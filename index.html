<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LKPD Pencemaran Air — Ebook Interaktif</title>
<style>
:root{--navy:#0b3d6e;--teal:#2aa7b8;--teal-d:#1b8a9b;--teal-l:#e6f4f7;--sky:#bfe6ef;--line:#cfe3ec;--orange:#f48b3c;--ink:#17324a;--muted:#5b7a90;--paper:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Segoe UI','Trebuchet MS',Arial,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 15% 10%,rgba(42,167,184,.28),transparent 45%),linear-gradient(150deg,#0a2f57,#0e4d7d 55%,#093056);background-attachment:fixed}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px 10px 92px}
/* BUKU POTRET */
.book{position:relative;height:min(86vh,880px);aspect-ratio:7/10;max-width:96vw;filter:drop-shadow(0 24px 45px rgba(0,10,30,.55))}
.page{position:absolute;inset:0;background:var(--paper);border-radius:16px;overflow:hidden;display:none;flex-direction:column;box-shadow:inset 0 0 0 1px var(--line)}
.page.active{display:flex;animation:pin .5s cubic-bezier(.25,.9,.3,1)}
@keyframes pin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.page.back-in{animation:pinb .5s cubic-bezier(.25,.9,.3,1)}
@keyframes pinb{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 18px 4px;gap:10px}
.hal{flex:0 0 auto;background:var(--navy);color:#fff;border-radius:12px;text-align:center;padding:6px 10px 7px;font-size:.58rem;letter-spacing:1px;line-height:1.1;font-weight:600}
.hal b{display:block;font-size:1.25rem;letter-spacing:0}
.ph-title{text-align:center;flex:1;padding-top:3px}
.lkpd{font-weight:800;color:var(--teal-d);font-size:.8rem;letter-spacing:2px}.lkpd span{color:#9db8c6;font-weight:400;padding:0 4px}.lkpd b{color:var(--navy)}
.drop{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:linear-gradient(160deg,#e8f7fa,#c9ecf2);border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.body{flex:1;padding:4px 20px 8px;overflow-y:auto}
.body::-webkit-scrollbar{width:6px}.body::-webkit-scrollbar-thumb{background:var(--sky);border-radius:6px}
.pf{position:relative;height:54px;flex:0 0 auto;background:linear-gradient(transparent 40%,rgba(42,167,184,.3) 60%,var(--navy) 100%)}
.pageno{position:absolute;right:16px;bottom:9px;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;box-shadow:0 0 0 2px #fff}
h2.sec{font-size:1.08rem;color:var(--navy);display:flex;align-items:center;gap:9px;margin:4px 0 10px;line-height:1.25}
h2.sec .ic{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:linear-gradient(150deg,#dff3f7,#bfe8ef);border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:1rem}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:0 4px 12px rgba(23,50,74,.07);margin-bottom:12px}
.card.tint{background:linear-gradient(180deg,#f2fafc,#e9f5f8)}
.badge-o,.badge-t{display:inline-block;color:#fff;font-weight:700;font-size:.66rem;letter-spacing:1px;padding:5px 12px;border-radius:20px;margin-bottom:9px}
.badge-o{background:var(--orange)}.badge-t{background:var(--teal-d)}
p{font-size:.88rem;line-height:1.6;margin-bottom:8px;text-align:justify}
ol.num{list-style:none;counter-reset:n;margin:6px 0 2px}
ol.num li{counter-increment:n;position:relative;padding-left:36px;margin-bottom:8px;font-size:.87rem;line-height:1.5}
ol.num li::before{content:counter(n);position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center}
ul.dash{margin:4px 0 6px 18px}ul.dash li{margin-bottom:5px;font-size:.87rem;line-height:1.5}
.q{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.qn{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--teal-d);color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.qt{flex:1;min-width:0}.qt p{font-weight:700;color:var(--navy);text-align:left;margin-bottom:3px;font-size:.88rem}
textarea.ans{width:100%;border:none;background-color:transparent;resize:none;background-image:repeating-linear-gradient(transparent,transparent 25px,var(--line) 26px);line-height:26px;font-size:.88rem;font-family:inherit;color:var(--ink);padding:0 2px;display:block}
textarea.ans:focus{outline:none;background-image:repeating-linear-gradient(transparent,transparent 25px,var(--teal) 26px)}
.idrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.idrow label{flex:0 0 84px;font-weight:700;font-size:.9rem}
.idrow input{flex:1;min-width:0;border:none;border-bottom:2px solid var(--sky);background:transparent;height:32px;font-size:.92rem;font-family:inherit;color:var(--ink);padding:0 4px}
.idrow input:focus{outline:none;border-bottom-color:var(--teal-d)}
table.tb{width:100%;border-collapse:separate;border-spacing:0;margin:4px 0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;font-size:.82rem}
.tb th{background:var(--navy);color:#fff;text-align:left;padding:8px 9px;font-size:.8rem}
.tb td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 7px;vertical-align:top;background:#fff}
.tb tr:last-child td{border-bottom:none}.tb th:last-child,.tb td:last-child{border-right:none}
.tb tr:nth-child(even) td{background:#f4fafc}
.warn,.info{border-radius:0 12px 12px 0;padding:9px 12px;font-size:.82rem;line-height:1.55;margin:9px 0}
.warn{background:#fff6ec;border-left:5px solid var(--orange)}.info{background:var(--teal-l);border-left:5px solid var(--teal-d)}
.illust{border-radius:14px;overflow:hidden;border:1.5px solid var(--line);margin-bottom:10px;position:relative}
.illust svg,.illust img{display:block;width:100%;height:auto}
.illust img.pic{max-height:300px;object-fit:cover;object-position:center 40%}
.illust .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(6,40,66,.8));color:#fff;font-size:.74rem;padding:16px 10px 7px;text-align:center;font-style:italic}
.srcs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.src{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.src .sic{width:44px;height:44px;margin:0 auto 6px;border-radius:50%;background:linear-gradient(150deg,#e4f5f8,#c4e9f0);border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.src b{font-size:.72rem;color:var(--navy)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:.87rem;cursor:pointer}
.chk input{width:19px;height:19px;accent-color:var(--teal-d);flex:0 0 auto}
.pbar{height:13px;background:#e2f0f4;border-radius:20px;overflow:hidden;margin:10px 0 5px;border:1px solid var(--line)}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--navy));transition:width .35s}
.ptext{font-size:.8rem;color:var(--muted)}
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:99;background:rgba(7,32,58,.92);padding:8px 16px;border-radius:40px;box-shadow:0 8px 24px rgba(0,0,0,.45);border:1px solid rgba(120,200,220,.3)}
.nav button{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.nav button:disabled{opacity:.35}
.nav .count{color:#fff;font-size:.9rem;min-width:130px;text-align:center;font-weight:600}
.toolbar{position:fixed;top:10px;right:10px;z-index:99;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.toolbar button{background:rgba(7,32,58,.92);color:#fff;border:1px solid rgba(120,200,220,.3);padding:7px 12px;border-radius:22px;font-size:.78rem;cursor:pointer}
#saveStatus{color:#fff;font-size:.75rem}
/* SAMPUL */
.cover{position:absolute;inset:0;border-radius:16px;overflow:hidden;color:#fff;display:flex;flex-direction:column;background:#0d4a7c center bottom/cover no-repeat}
.cover::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,32,60,.93) 0%,rgba(8,42,78,.78) 34%,rgba(8,42,78,.1) 62%,rgba(6,32,60,.55) 100%)}
.cov-inner{position:relative;z-index:2;padding:40px 30px 0}
.cov-badge{display:inline-block;background:#ffc83d;color:#3a2e05;font-weight:800;font-size:.68rem;letter-spacing:2px;padding:7px 16px;border-radius:20px;margin-bottom:16px}
.cov-inner h1{font-size:2.3rem;line-height:1.1;letter-spacing:1px;text-shadow:0 3px 10px rgba(0,0,0,.5)}
.cov-inner h2{font-size:.98rem;font-weight:600;margin-top:12px;color:#d7f1f7;line-height:1.4}
.cov-inner h2 span{color:#ffd166}
.cov-meta{margin-top:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:10px 14px;font-size:.82rem;line-height:1.9;width:fit-content;backdrop-filter:blur(3px)}
.cov-foot{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:.72rem;color:#fff;z-index:3;padding:0 14px;text-shadow:0 1px 4px #000}
@media(max-width:600px){.book{height:calc(100vh - 150px);height:calc(100dvh - 150px);width:96vw;aspect-ratio:auto}.cov-inner h1{font-size:1.8rem}.toolbar button{padding:6px 9px;font-size:.72rem}}
@media print{body{background:#fff}.nav,.toolbar{display:none}.stage{padding:0;display:block}.book{height:auto;width:100%;aspect-ratio:auto;filter:none}.page{position:static;display:flex!important;height:100vh;page-break-after:always;animation:none}.body{overflow:visible}}
</style>
</head>

const content=[
/*2*/S('🪪','Identitas Peserta Didik')+`<span class="badge-o">ISI SEBELUM MULAI</span><div class="card tint"><p>Isilah identitas berikut dengan lengkap sebelum memulai kegiatan pembelajaran.</p><div class="idrow"><label>Nama</label><input type="text" id="nama"></div><div class="idrow"><label>Kelas</label><input type="text" id="kelas"></div><div class="idrow"><label>Kelompok</label><input type="text" id="kelompok"></div><div class="idrow"><label>Tanggal</label><input type="date" id="tanggal"></div></div><div class="info">💡 LKPD ini digunakan dalam <b>2–3 pertemuan</b>: analisis pencemaran air, praktik penjernihan air, dan presentasi hasil.</div>`,
/*3*/S('🎯','A. Tujuan Pembelajaran')+`<div class="card"><p>Setelah mengikuti kegiatan pembelajaran, peserta didik diharapkan mampu:</p><ol class="num"><li>Menjelaskan pengertian pencemaran air.</li><li>Mengidentifikasi sumber dan penyebab pencemaran air.</li><li>Menganalisis dampak pencemaran air terhadap manusia dan ekosistem.</li><li>Menjelaskan upaya pencegahan dan penanggulangan pencemaran air.</li><li>Merancang proyek sederhana penjernihan air untuk memperbaiki kualitas fisik air.</li></ol></div><div class="info">💧 <i>“Belajar dari masalah di sekitar kita adalah cara terbaik memahami ilmu pengetahuan.”</i></div>`,
/*4*/S('📖','B. Petunjuk &amp; C. Materi Singkat')+`<div class="card"><span class="badge-t">BACA • AMATI • DISKUSIKAN • TULISKAN</span><ol class="num"><li>Bacalah materi pencemaran air dengan cermat.</li><li>Amati gambar atau permasalahan yang disajikan.</li><li>Kerjakan setiap pertanyaan bersama anggota kelompok.</li><li>Diskusikan jawaban berdasarkan hasil pengamatan dan informasi yang diperoleh.</li><li>Tuliskan hasil diskusi dengan bahasa sendiri.</li></ol></div><div class="card"><span class="badge-t">MATERI SINGKAT</span><p>Pencemaran air adalah <b>masuknya zat atau bahan pencemar ke dalam perairan</b> yang menyebabkan kualitas air menurun. Pencemaran air dapat berasal dari limbah rumah tangga, industri, pertanian, peternakan, dan sampah.</p><p>Pencemaran air menyebabkan perubahan warna, bau, dan kondisi air. Dampaknya antara lain terganggunya kehidupan organisme perairan, berkurangnya ketersediaan air bersih, serta meningkatnya risiko gangguan kesehatan.</p><p>Salah satu upaya mengurangi pencemaran air adalah <b>mengolah limbah sebelum dibuang</b> ke lingkungan dan menjaga kebersihan sumber air.</p></div><span class="badge-t">SUMBER PENCEMAR AIR</span><div class="srcs"><div class="src"><div class="sic">🏠</div><b>LIMBAH RUMAH TANGGA</b></div><div class="src"><div class="sic">🏭</div><b>LIMBAH INDUSTRI</b></div><div class="src"><div class="sic">🌾</div><b>AKTIVITAS PERTANIAN</b></div><div class="src"><div class="sic">🐄</div><b>PETERNAKAN</b></div></div>`,
/*5*/S('👁️','D. Kegiatan 1 — Mengamati Permasalahan')+`<span class="badge-o">AMATILAH ILUSTRASI BERIKUT!</span><div class="illust"><img class="pic" alt="Sungai tercemar"><div class="cap">Sungai keruh, berbau tidak sedap, dan dipenuhi sampah serta limbah</div></div><div class="warn"><b>Situasi:</b> Sungai dekat permukiman tampak keruh, berbau tidak sedap, dan banyak sampah plastik. Warga masih memakai air sungai untuk kebutuhan sehari-hari. Diduga akibat pembuangan sampah dan limbah langsung ke sungai.</div>`+Q(1,'Apa permasalahan lingkungan pada sungai tersebut?',56)+Q(2,'Apa saja penyebab pencemaran air tersebut?',56)+Q(3,'Apa ciri-ciri air yang diduga telah tercemar?',56),
/*6*/S('📋','Analisis Dampak &amp; E. Kegiatan 2 — Identifikasi Sumber Pencemar')+Q(4,'Bagaimana dampak pencemaran terhadap manusia dan organisme di sungai?',78)+Q(5,'Tindakan apa yang sebaiknya dilakukan untuk mengatasi permasalahan tersebut?',78)+`<div class="card"><span class="badge-t">LENGKAPI TABEL BERIKUT</span><table class="tb"><tr><th style="width:30%">Aktivitas</th><th>Sumber pencemar</th><th>Dampak</th></tr>${rows3(['Membuang deterjen ke sungai','Membuang limbah pabrik','Pestisida berlebihan','Sampah plastik','Kotoran ternak ke sungai'],52)}</table></div>`,
/*7*/S('💡','E. Pertanyaan Diskusi Kelompok')+`<div class="card">`+Q(1,'Aktivitas mana yang paling sering ditemukan di lingkungan sekitar kalian?',78)+Q(2,'Mengapa aktivitas tersebut dapat menyebabkan pencemaran air?',78)+Q(3,'Bagaimana cara mencegah agar tidak mencemari perairan?',78)+`</div><div class="info">🧪 Setelah memahami sumber pencemaran, saatnya bereksperimen!</div>`,
/*8*/S('🧪','F. Kegiatan 3 — Proyek: Penjernihan Air Sederhana')+`<div class="illust" style="max-width:230px;margin:0 auto 10px"><svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="250" fill="#eaf6fa"/><circle cx="150" cy="34" r="16" fill="#bfe3f2" stroke="#5b87a3" stroke-width="2"/><path d="M104,58 L196,58 L176,96 L176,150 L124,150 L124,96 Z" fill="#fff" stroke="#5b87a3" stroke-width="2.5"/><rect x="126" y="94" width="48" height="10" fill="#f4f6f7"/><rect x="126" y="104" width="48" height="14" fill="#3a3a3a"/><rect x="126" y="118" width="48" height="16" fill="#e3c98f"/><rect x="126" y="134" width="48" height="16" fill="#9aa5ab"/><circle cx="150" cy="168" r="3.5" fill="#5b87a3"/><circle cx="150" cy="180" r="3" fill="#5b87a3"/><rect x="86" y="196" width="128" height="48" rx="10" fill="#dceef7" stroke="#5b87a3" stroke-width="2.5"/><text x="150" y="226" text-anchor="middle" font-size="11" fill="#3d566e">Wadah penampung</text><text x="150" y="24" text-anchor="middle" font-size="11" fill="#3d566e">Air keruh</text></svg></div><div class="card tint"><p style="margin:0"><b>Tujuan:</b> Memahami pengolahan air melalui penyaringan dengan bahan sederhana.</p></div><div class="card"><span class="badge-t">ALAT &amp; BAHAN</span><ul class="dash"><li>Wadah penampung air &amp; botol penyaring</li><li>Kerikil, pasir, arang aktif</li><li>Kapas atau kain penyaring</li><li>Air keruh untuk percobaan</li></ul></div><div class="card"><span class="badge-t">LANGKAH KEGIATAN</span><ol class="num"><li>Siapkan alat dan bahan; amati kondisi awal air keruh.</li><li>Susun bahan penyaring pada alat yang disiapkan guru.</li><li>Tuangkan air keruh perlahan ke dalam alat penyaring.</li><li>Tampung hasil penyaringan pada wadah bersih.</li><li>Amati perubahan air sebelum dan sesudah penyaringan, lalu catat hasilnya.</li></ol></div>`,
/*9*/S('📋','F. Tabel Hasil Pengamatan')+`<div class="card"><span class="badge-t">CATAT HASIL PERCOBAANMU</span><table class="tb"><tr><th>Aspek</th><th>Sebelum</th><th>Sesudah</th></tr>${rows3(['<b>Warna air</b>','<b>Tingkat kekeruhan</b>','<b>Bau air</b>','<b>Partikel terlihat</b>'],56)}</table></div><div class="warn"><b>⚠️ Catatan keselamatan:</b> Air hasil percobaan <b>tidak boleh diminum</b>. Penyaringan sederhana hanya mengurangi partikel dan kekeruhan — tidak menjamin hilangnya mikroorganisme patogen maupun bahan kimia terlarut.</div>`,
/*10*/S('💡','F. Pertanyaan Analisis')+`<div class="card">`+Q(1,'Apa perbedaan kondisi air sebelum dan sesudah penyaringan?',56)+Q(2,'Apa fungsi kerikil, pasir, arang aktif, dan kapas dalam penyaringan?',56)+Q(3,'Mengapa air hasil saringan terlihat lebih jernih?',56)+Q(4,'Apakah air hasil penyaringan sudah pasti aman diminum? Jelaskan.',56)+Q(5,'Dapatkah metode ini mengatasi semua jenis pencemaran air?',56)+`</div>`,
/*11*/S('⭐','G. Kegiatan 4 — Menyusun Solusi Permasalahan')+`<div class="card"><span class="badge-o">DISKUSIKAN BERSAMA KELOMPOKMU!</span><table class="tb"><tr><th>Permasalahan</th><th>Solusi yang ditawarkan</th></tr>${rows2(['Sampah menumpuk di sungai','Limbah rumah tangga mencemari air','Limbah industri dibuang ke sungai','Penggunaan pestisida berlebihan','Berkurangnya sumber air bersih'],64,38)}</table></div>`,
/*12*/S('✅','H. Kesimpulan')+`<span class="badge-t">JAWAB DALAM BENTUK PARAGRAF</span><div class="card">`+Q(1,'Apa yang kalian pahami tentang pencemaran air?',78)+Q(2,'Apa hubungan aktivitas manusia dengan terjadinya pencemaran air?',78)+Q(3,'Mengapa menjaga kualitas air penting bagi kehidupan?',78)+Q(4,'Apa tindakan nyata yang dapat kalian lakukan untuk mengurangi pencemaran air?',78)+`</div>`,
/*13*/S('✅','I. Refleksi Pembelajaran')+`<div class="card">${['Saya dapat menjelaskan pengertian pencemaran air.','Saya dapat mengidentifikasi sumber pencemaran air.','Saya dapat menjelaskan dampak pencemaran air.','Saya memahami prinsip dasar penjernihan air.','Saya dapat memberikan solusi terhadap pencemaran air.'].map(t=>`<label class="chk"><input type="checkbox" class="refleksi"><span>${t}</span></label>`).join('')}<div class="pbar"><div class="pfill" id="progressFill"></div></div><div class="ptext" id="progressText">0 dari 5 pernyataan telah dicentang.</div></div><div class="info">💧 <i>“Air merupakan sumber kehidupan. Menjaga kebersihan air bukan hanya tanggung jawab pemerintah, tetapi juga tanggung jawab kita bersama.”</i></div>`,

document.querySelectorAll('img.pic').forEach(i=>i.src=IMG5);

const pages=[...document.querySelectorAll('.page')],N=pages.length;let cur=0;
function render(dir){
  pages.forEach((p,i)=>p.classList.toggle('active',i===cur));
  if(dir<0){const el=pages[cur];el.classList.remove('back-in');void el.offsetWidth;el.classList.add('back-in')}
  document.getElementById('counter').textContent='Halaman '+(cur+1)+' / '+N;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').disabled=cur===N-1;
  document.title='LKPD Pencemaran Air — Halaman '+(cur+1);
}
function go(d){cur=Math.max(0,Math.min(N-1,cur+d));render(d)}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});

const refleksi=document.querySelectorAll('.refleksi');
function updProg(){const n=document.querySelectorAll('.refleksi:checked').length;document.getElementById('progressFill').style.width=(n/5*100)+'%';document.getElementById('progressText').textContent=n+' dari 5 pernyataan telah dicentang.'}
refleksi.forEach(cb=>cb.addEventListener('change',updProg));

const KEY='lkpd_pencemaran_air_ebook_v3';
function kumpulkan(){const d={_page:cur};document.querySelectorAll('input[type=text],input[type=date]').forEach(el=>d[el.id]=el.value);document.querySelectorAll('textarea.jawaban').forEach((el,i)=>d['jwb_'+i]=el.value);refleksi.forEach((el,i)=>d['ref_'+i]=el.checked);return d}
function simpanData(){try{localStorage.setItem(KEY,JSON.stringify(kumpulkan()));document.getElementById('saveStatus').textContent='✓ Tersimpan '+new Date().toLocaleTimeString('id-ID')}catch(e){document.getElementById('saveStatus').textContent='Gagal menyimpan'}}
function muatData(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}if(!raw)return;let d;try{d=JSON.parse(raw)}catch(e){return}
  document.querySelectorAll('input[type=text],input[type=date]').forEach(el=>{if(d[el.id]!==undefined)el.value=d[el.id]});
  document.querySelectorAll('textarea.jawaban').forEach((el,i)=>{if(d['jwb_'+i]!==undefined)el.value=d['jwb_'+i]});
  refleksi.forEach((el,i)=>{if(d['ref_'+i])el.checked=true});updProg();
  if(d._page!==undefined)cur=Math.max(0,Math.min(N-1,d._page))}
function resetData(){if(!confirm('Hapus semua jawaban yang tersimpan?'))return;try{localStorage.removeItem(KEY)}catch(e){}
  document.querySelectorAll('input[type=text],input[type=date]').forEach(el=>el.value='');
  document.querySelectorAll('textarea.jawaban').forEach(el=>el.value='');
  refleksi.forEach(el=>el.checked=false);updProg();document.getElementById('saveStatus').textContent=''}
muatData();render(0);
</script>
